<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>36 Câu Hỏi</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme-preference');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1 class="title">Question</h1>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển giao diện">
          <span id="themeIcon" aria-hidden="true">🌙</span>
        </button>
      </div>
      <p class="subtitle"></p>
    </header>

    <main class="card-wrap">
      <div class="card" id="card">
        <p class="question" id="questionText">Nhấn &quot;Câu tiếp theo&quot; để bắt đầu.</p>
      </div>

      <div class="congrats" id="congrats" hidden>
        <h2 class="congrats-title">🎉 Hoàn thành!</h2>
        <p class="congrats-text">Bạn đã xem hết cả 36 câu hỏi. Hy vọng hai bạn đã hiểu nhau hơn một chút.</p>
        <button class="btn btn-primary" id="retryBtn" type="button">Làm lại từ đầu</button>
      </div>
    </main>

    <div class="actions" id="actions">
      <button class="btn btn-primary" id="nextBtn" type="button">Câu tiếp theo →</button>
      <button class="btn btn-secondary" id="skipBtn" type="button">Bỏ qua câu này</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
